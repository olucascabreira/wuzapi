version: "3.7"

services:
  wuzapi-server:
    image: ${WUZAPI_IMAGE:-wuzapi:latest}
    ports:
      - "8080:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN:-admin123}
      - DB_USER=${DB_USER:-wuzapi}
      - DB_PASSWORD=${DB_PASSWORD:-wuzapi}
      - DB_NAME=${DB_NAME:-wuzapi}
      - DB_HOST=db
      - DB_PORT=5432
      - TZ=${TZ:-America/Sao_Paulo}
      - WEBHOOK_FORMAT=${WEBHOOK_FORMAT:-json}
      - SESSION_DEVICE_NAME=${SESSION_DEVICE_NAME:-WuzAPI}
    volumes:
      - wuzapi_data:/app/dbdata
      - wuzapi_files:/app/files
    depends_on:
      - db
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-wuzapi}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-wuzapi}
      - POSTGRES_DB=${DB_NAME:-wuzapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  wuzapi_data:
  wuzapi_files:
  postgres_data:
